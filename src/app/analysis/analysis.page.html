<app-header></app-header>
<ion-content id="containervalue" class="content">
  <ion-card class="citation-card">
    <form [formGroup]="form">
      <div id="container" >
        <ion-list>
          <ion-item lines="none">
            <div class="dropdownContainer">
              <ion-label>Cancer</ion-label>
              <select class="dropdown" formControlName="selectedCancer" (change)="cancerChanged($event)">
                @for (cancer of (analysis == 'proteomics' ? proteomicCancers : cancers); track cancer.id)
                {
                  <option value="{{cancer.id}}">{{cancer.name}}</option>
                }
              </select>
            </div>
          </ion-item>
          <ion-item class="topPad" lines="none">
            <div class="dropdownContainer">
              <ion-label>Gene</ion-label>
              <ng-select class="dropdown" [items]="genes | async" bindLabel="name"
                         formControlName="name" notFoundText="No records found"
                         [multiple]="false"
                         appendTo="#containervalue"
                         (keyup)="getGeneName($event)">
              </ng-select>
            </div>
          </ion-item>
          <ion-item class="topPad" lines="none">
            <div class="fieldSet" >
              <ion-label>Analysis</ion-label>
              <ion-radio-group value="expression" (ionChange)="analysisChanged($event)">
                <ion-item lines="none">
                  <ion-radio value="expression" mode="md" justify="start" labelPlacement="fixed">Expression</ion-radio>
                </ion-item>
                <ion-item lines="none">
                  <ion-radio value="methylation" mode="md" justify="start" labelPlacement="fixed">Methylation</ion-radio>
                </ion-item>
                <ion-item lines="none">
                  <ion-radio value="proteomics" mode="md" justify="start" labelPlacement="fixed">Proteomics</ion-radio>
                </ion-item>
              </ion-radio-group>
            </div>
          </ion-item>
        </ion-list>
      </div>
    </form>
    <div class="searchButtonContainer">
      <ion-button (click)='searchClicked()' class="searchbutton" routerDirection="forward">Search</ion-button>
    </div>
  </ion-card>
  <app-footer></app-footer>
</ion-content>
