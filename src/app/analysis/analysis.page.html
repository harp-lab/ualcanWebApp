<app-header></app-header>
<ion-content id="containervalue" class="content">
  <ion-card class="citation-card">
    <form [formGroup]="form">
      <div id="container" >
        <ion-list>
          <ion-item lines="none">
            <div class="dropdownContainer">
              <ion-label>Cancer</ion-label>
              <select class="dropdown" formControlName="selectedCancer" (change)="cancerChanged($event)">
                @let analysis = form.get('selectedAnalysis')?.value;
                @for (cancer of (analysis == 'proteomics' 
                                  ? proteomicCancers 
                                  : (analysis == 'methylation' 
                                    ? methylationCancers 
                                    : expressionCancers)); track cancer.id)
                {
                  <option value="{{cancer.id}}">{{cancer.name}}</option>
                }
              </select>
            </div>
          </ion-item>
          <ion-item lines="none">
            <div class="dropdownContainer">
              <ion-label>Gene</ion-label>
              <ng-select class="dropdown" [items]="genes | async" bindLabel="name"
                        formControlName="selectedGene" notFoundText="No records found"
                        [multiple]="false"
                        appendTo="#containervalue"
                        (keyup)="getGeneName($event)">
              </ng-select>
            </div>
          </ion-item>
          <ion-item lines="none">
            <div class="dropdownContainer">
              <ion-label>Analysis</ion-label>
              <select class="dropdown" formControlName="selectedAnalysis" (change)="analysisChanged($event)">
                <option value="expression">Expression</option>
                <option value="methylation">Methylation</option>
                <option value="proteomics">Proteomics</option>
              </select>
            </div>
          </ion-item>
        </ion-list>
      </div>
    </form>
    <div class="searchButtonContainer">
      <ion-button (click)='searchClicked()' size="small" class="searchbutton" routerDirection="forward">Search</ion-button>
    </div>
  </ion-card>
  <app-footer></app-footer>
</ion-content>
