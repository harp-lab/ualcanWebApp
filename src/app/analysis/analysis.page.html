<app-header></app-header>
<ion-content class="content">
  <ion-card class="citation-card">
    <form [formGroup]="form">
      <div id="container" >
        <ion-list>
          <ion-item lines="none">
            <div class="dropdownContainer">
              <ion-label>Cancer</ion-label>
              <ng-select class="dropdown" 
                        [items]="cancers"
                        bindLabel="name"
                        bindValue="id"
                        [clearable]="false"
                        [searchable]="false"
                        formControlName="selectedCancer"
                        appendTo="body"
                        (change)="cancerChanged($event.id)">
              </ng-select>
            </div>
          </ion-item>
          <ion-item lines="none">
            <div class="dropdownContainer">
              <ion-label>Gene</ion-label>
              <ng-select class="dropdown" 
                        [items]="genes | async" 
                        bindLabel="name"
                        formControlName="selectedGene" 
                        notFoundText="No records found"
                        [multiple]="false"
                        appendTo="body"
                        (keyup)="getGenes($event)">
              </ng-select>
            </div>
          </ion-item>
          <ion-item lines="none">
            <div class="dropdownContainer">
              <ion-label>Analysis</ion-label>
              <ng-select class="dropdown" 
                        [items]="analyses"
                        bindLabel="name"
                        bindValue="id"
                        [clearable]="false"
                        [searchable]="false"
                        formControlName="selectedAnalysis"
                        appendTo="body"
                        (change)="analysisChanged($event.id)">
              </ng-select>
            </div>
          </ion-item>
        </ion-list>
      </div>
    </form>
    <div class="searchButtonContainer">
      <ion-button (click)='searchClicked()' size="small" class="searchbutton" routerDirection="forward">Search</ion-button>
    </div>
  </ion-card>
  <app-footer></app-footer>
</ion-content>
