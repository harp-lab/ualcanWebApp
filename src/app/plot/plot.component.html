<ion-header class="title-header">
  <!--This is just to cover the status bar-->
</ion-header>
<ion-content class="content">
  <ion-card id="plotCard" class="citation-card">
    <div id="plotTable">
      <div class="plotDiv">
        <div>
            <span id="plotTitle">Group By:&nbsp;&nbsp;</span>
            <select class="customdrop" id="plotSelect" (change)="show($event)">
              @for (grouping of groupings(); track grouping)
              {
                <option value="{{grouping}}">{{grouping}}</option>
              }
            </select>
        </div>
        <div id="box-plot"></div>
        @if (statistics().length > 0)
        { 
          <div [innerHTML]="SafeSharedCss"></div>
          <table #plotStatistics class="plotStatisticsTable">
            <tr>
              <td class="plotStatistics plotStatisticsHeader">Comparison</td>
              <td class="plotStatistics plotStatisticsHeader">Statistical significance</td>
            </tr>
            @for (stat of statistics(); track stat.name)
            {
              <tr [ngStyle]="stat.style">
                <td class="plotStatistics plotStatisticsCell">{{stat.name}}</td>
                <td class="plotStatistics plotStatisticsCell">{{stat.value}}</td>
              </tr>
            }
          </table>
        }
      </div>
    </div>
  </ion-card>
  <app-footer></app-footer>
</ion-content>
